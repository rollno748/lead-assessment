name: Performance Workflow

permissions:
  contents: read
  pages: write
  id-token: write

on: 
  push: 
    branches: [master]
  workflow_dispatch:

jobs:
  load-test:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    strategy:
      matrix:
        environment: [perf]

    env:
      SCRIPTS_PATH: 'scripts/jsonplaceholder-test.jmx'
      CONFIG_PATH: 'scripts/config/${{matrix.environment}}.properties'
      
    steps:
      - name: RepoCheckout
        uses: actions/checkout@v4
      
      - name: Install JDK11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install JMeter
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          wget https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.zip
          unzip apache-jmeter-5.6.3.zip
          mv apache-jmeter-5.6.3 apache-jmeter

      # - name: Install Plugins Manager
      #   run: |
      #     wget https://jmeter-plugins.org/get/ -O apache-jmeter/lib/ext/plugins-manager.jar
      #     apache-jmeter/bin/jmeter -n -h > /dev/null 2>&1 || true
      #     ls -la apache-jmeter/bin/PluginsManagerCMD.sh
      #     chmod +x apache-jmeter/bin/PluginsManagerCMD.sh
      #     apache-jmeter/bin/PluginsManagerCMD.sh install \
      #     jpgc-standard \
      #     jpgc-dummy \
      #     jpgc-functions \
      #     jpgc-graphs-basic \
      #     jpgc-graphs-additional \
      #     jpgc-cmd

      - name: Generate Timestamp
        run: echo "TEST_RUN_ID=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_ENV

      - name: Run JMeter Test
        run: |
          mkdir -p results/dashboard/${TEST_RUN_ID}
          apache-jmeter/bin/jmeter -n \
            -t ${SCRIPTS_PATH} \
            -q ${CONFIG_PATH} \
            -l results/results_${TEST_RUN_ID}.jtl \
            -e -o results/dashboard/${TEST_RUN_ID}

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-results-${{env.TEST_RUN_ID}}
          path: results/dashboard/${{env.TEST_RUN_ID}}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: results/dashboard/${{ env.TEST_RUN_ID }}
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Validate Performance Thresholds
        run: |
          STATS="results/dashboard/${TEST_RUN_ID}/statistics.json"
          P90=$(jq -r '.Total.pct1ResTime' "$STATS")
          ERROR_PCT=$(jq -r '.Total.errorPct' "$STATS")

          echo "90th percentile: $P90 ms"
          echo "error percentage: $ERROR_PCT%"

          if (( $(echo "$P90 > 1000" | bc -l) )); then
            echo "90th percentile response time above threshold"
            exit 1
          fi

          if (( $(echo "$ERROR_PCT > 3" | bc -l) )); then
            echo "Error percentage is above 3%"
            exit 1
          fi
          echo "✅ Performance thresholds passed"

